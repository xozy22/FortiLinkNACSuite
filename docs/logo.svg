<svg xmlns="http://www.w3.org/2000/svg" width="660" height="150" viewBox="0 0 660 150" role="img" aria-label="FortiLink NAC Suite">
  <title>FortiLink NAC Suite</title>

  <defs>
    <linearGradient id="flnsMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4130"/>
      <stop offset="1" stop-color="#a81d12"/>
    </linearGradient>
  </defs>

  <!-- Mark: a shield above a row of switch ports -->
  <g transform="translate(20 27)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#flnsMark)"/>

    <path d="M48 14 L67 21 V40 c0 11 -7.5 19.5 -19 24 c-11.5 -4.5 -19 -13 -19 -24 V21 Z"
          fill="none" stroke="#fff" stroke-width="4.6" stroke-linejoin="round"/>
    <path d="M39.5 38.5 l6 6 l12.5 -13.5" fill="none" stroke="#fff" stroke-width="4.6"
          stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="#fff" opacity="0.9">
      <rect x="25" y="74" width="10" height="7" rx="1.6"/>
      <rect x="39" y="74" width="10" height="7" rx="1.6"/>
      <rect x="53" y="74" width="10" height="7" rx="1.6"/>
      <rect x="67" y="74" width="10" height="7" rx="1.6"/>
    </g>
  </g>

  <!-- Wordmark. Colours chosen to read on both light and dark GitHub themes. -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="140" y="68" font-size="40" font-weight="650" fill="#da291c" letter-spacing="-0.6">
      FortiLink<tspan fill="#8b98a9" font-weight="400"> NAC Suite</tspan>
    </text>
    <text x="142" y="96" font-size="16" fill="#8b98a9" letter-spacing="0.2">
      Dynamic port policies for FortiLink-managed FortiSwitches
    </text>
    <rect x="142" y="110" width="452" height="2.5" rx="1.25" fill="#da291c" opacity="0.35"/>
  </g>
</svg>
